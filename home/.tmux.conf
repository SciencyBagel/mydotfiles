# Shell and interaction defaults.
set-option -g default-shell /bin/zsh
set-option -g mode-keys vi
set-option -g mouse on
set-option -sg escape-time 4
set-option -g focus-events on
set-option -g renumber-windows on
set-option -g word-separators " |{}()[]<>`='!^&*\\\""

# Terminal integrations: CSI-u keys for Pi and passthrough for Yazi.
set-option -g extended-keys on
set-option -g extended-keys-format csi-u
set-option -g allow-passthrough on
set-option -ga update-environment TERM
set-option -ga update-environment TERM_PROGRAM

# Vim-style pane navigation and window switching.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R # Overrides tmux's default last-window binding.
bind-key o last-window

# Open new panes and windows in the current pane's directory.
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Status and tmux-power theme settings (loaded by TPM below).
set-option -g status-right '%a %Y-%m-%d %H:%M'
set -g @tmux_power_theme 'sky'
set -g @tmux_power_prefix_highlight_pos 'L'
set -g @prefix_highlight_prefix_prompt 'PREFIX'

# Plugins.
set-option -g @plugin 'tmux-plugins/tpm'
set-option -g @plugin 'tmux-plugins/tmux-sensible'
set-option -g @plugin 'tmux-plugins/tmux-resurrect'
set-option -g @plugin 'wfxr/tmux-power'
set-option -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# tmux-power sets status back to one row; override it after the plugins load.
run '~/.tmux/plugins/tpm/tpm'

# Keep the session/window bar visible while the command prompt uses row 2.
set-option -g status 2
set-option -g message-line 1
