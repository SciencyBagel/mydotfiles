set-option -g default-shell /bin/zsh

set-option -g mode-keys vi
set-option -g mouse on
set -sg escape-time 10

set -g focus-events on
set -g extended-keys on

# # vim-like pane selecting
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R # NOTE: this overwrites go to last window

bind-key o last-window

# to allow yazi to work
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind-key c new-window -c "#{pane_current_path}"

# plugin specific commands
set -g status-right '%a %Y-%m-%d %H:%M'
# set -g status-style bg=colour235,fg=white

# Background changes to red when prefix is active, black when not
set -g status-style "bg=#{?client_prefix,red,black}"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
