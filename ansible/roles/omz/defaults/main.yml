---

# defaults file for roles/omz

# The user to install oh-my-zsh for.
omz_user: "{{ target_user }}"

# Resolved home directory for the user. Uses the Ansible-discovered
# value so the same default works on Linux (/home/...) and macOS (/Users/...).
omz_home: "{{ ansible_user_dir }}"

# oh-my-zsh install path.
omz_dir: "{{ omz_home }}/.oh-my-zsh"
