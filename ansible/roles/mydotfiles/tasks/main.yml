---
# tasks file for roles/mydotfiles

# --- Clone mydotfiles repo ---
- name: Check if mydotfiles repo already exists
  ansible.builtin.stat:
    path: "{{ mydotfiles_repo_dest }}"
  register: mydotfiles_cloned

  # WARN: should be read only
- name: Clone mydotfiles repo (with submodules for oh-my-zsh plugins)
  ansible.builtin.git:
    repo: "{{ mydotfiles_repo }}"
    dest: "{{ mydotfiles_repo_dest }}"
    version: main
    update: true # pulls latest if already cloned
    recursive: true # init/update submodules (oh-my-zsh plugins)
    force: true # because the repo is the single soiurce of truth
    accept_hostkey: true
  become: true
  become_user: "{{ mydotfiles_user }}"

- name: Move .zshrc file somewhere to avoid conflict
  ansible.builtin.file:
    path: "{{ mydotfiles_user_home }}/.zshrc"
    state: absent

# Adopt any conflicting files into the repo so stow can proceed,
# then immediately restore the repo to discard them.
# This is the standard pattern for resolving pre-existing file conflicts with stow.
- name: Stow dotfiles, adopting any conflicting files
  become: true
  become_user: "{{ mydotfiles_user }}"
  ansible.builtin.command:
    cmd: >
      stow --adopt --restow
      --dir {{ mydotfiles_repo_dest }}
      --target {{ mydotfiles_user_home }}
      home
  # stow exits 0 whether or not it made changes, so we check its output
  # for lines that indicate a symlink was created or modified
  register: mydotfiles_stow_result
  changed_when: "'LINK' in mydotfiles_stow_result.stderr or 'UNLINK' in mydotfiles_stow_result.stderr"
