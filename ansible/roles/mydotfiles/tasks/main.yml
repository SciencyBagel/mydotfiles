---
# tasks file for roles/mydotfiles

# --- Clone mydotfiles repo ---
- name: Check if mydotfiles repo already exists
  ansible.builtin.stat:
    path: "{{ mydotfiles_repo_dest }}"
  register: mydotfiles_cloned

  # WARN: should be read only
- name: Clone mydotfiles repo (with submodules for oh-my-zsh plugins and nvim config)
  ansible.builtin.git:
    repo: "{{ mydotfiles_repo }}"
    dest: "{{ mydotfiles_repo_dest }}"
    version: main
    update: true # pulls latest if already cloned
    recursive: true # init/update submodules (oh-my-zsh plugins, jahir-nvim-config)
    force: true # because the repo is the single source of truth
    accept_hostkey: true
  become: true
  become_user: "{{ mydotfiles_user }}"

# .zshrc here is always either the oh-my-zsh installer's default template
# (never customized) or a symlink from a previous run — safe to delete
# outright so stow can symlink the repo's version in its place.
- name: Remove .zshrc so stow can symlink the repo's version
  ansible.builtin.file:
    path: "{{ mydotfiles_user_home }}/.zshrc"
    state: absent

# Adopt any other conflicting files into the repo so stow can proceed.
# The next run's `force: true` git pull resets the clone back to origin,
# discarding whatever got adopted — this is the standard pattern for
# resolving pre-existing file conflicts with stow.
- name: Stow dotfiles, adopting any conflicting files
  become: true
  become_user: "{{ mydotfiles_user }}"
  ansible.builtin.command:
    cmd: >
      stow --adopt --restow
      --dir {{ mydotfiles_repo_dest }}
      --target {{ mydotfiles_user_home }}
      home
  # stow exits 0 whether or not it made changes, so we check its output
  # for lines that indicate a symlink was created or modified
  register: mydotfiles_stow_result
  changed_when: "'LINK' in mydotfiles_stow_result.stderr or 'UNLINK' in mydotfiles_stow_result.stderr"
