common_system_packages:
  - curl
  - git
  - zsh
  - coreutils
  - nodejs
  - npm
  - make
  - automake
  - cmake
  - gcc
  - stow
  - neovim # nice to have at system level

# Compiler/kernel-header package names differ across package managers, so
# these get merged onto common_system_packages by os_family (see tasks/main.yml).
common_system_packages_by_family:
  RedHat:
    - gcc-c++
    - kernel-devel
  Debian:
    - g++
    - raspberrypi-kernel-headers
