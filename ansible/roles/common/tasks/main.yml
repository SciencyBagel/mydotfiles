---
# Debian's rolling mirror prunes superseded package files on its own schedule,
# independent of cache_valid_time, so a locally-cached index can point at a
# .deb that's already gone (404) even if the cache itself isn't "old". Must
# run before any package install below, so it can't be a play-level pre_task.
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Install Fedora/RHEL-only packages
  become: true
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop:
    - epel-release
  when: ansible_facts['os_family'] == "RedHat"

- name: Install system packages
  become: true
  ansible.builtin.package:
    name: "{{ common_system_packages + (common_system_packages_by_family[ansible_facts['os_family']] | default([])) }}"
    state: present

# --- Set zsh as default shell ---
- name: Set zsh as default shell for user
  ansible.builtin.user:
    name: "{{ common_user }}"
    shell: /bin/zsh

- name: Run Homebrew tasks
  ansible.builtin.import_tasks: homebrew.yml
