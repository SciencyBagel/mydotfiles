---
# tasks file for roles/common

# Baseline configuration applied to every Raspberry Pi

# --- System Updates ---
# - name: Update apt package cache
#   ansible.builtin.package:
#     update_cache: true
#     cache_valid_time: 3600       # Only update if cache is older than 1 hour

# - name: Upgrade all packages to latest
#   ansible.builtin.package:
#     upgrade: dist                # Full dist-upgrade
#
# --- Common Packages ---
- name: Install baseline packages
  ansible.builtin.package:
    name: "{{ common_packages }}"  # References a variable (defined in defaults)
    state: present

# --- Timezone ---
# - name: Set timezone
#   community.general.timezone:
#     name: "{{ common_timezone }}"  # References a variable
#
# --- Set zsh as default shell ---
- name: Set zsh as default shell for user
  ansible.builtin.user:
    name: "{{ common_user }}"
    shell: /bin/zsh

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  with_items:
    - /opt/homebrew/bin/brew
    - /usr/local/bin/brew
    - /home/linuxbrew/.linuxbrew/bin/brew
  register: common_brew_check

- name: Set fact if Homebrew exists
  ansible.builtin.set_fact:
    common_brew_installed: "{{ common_brew_check.results | map(attribute='stat.exists') | list is any }}"

- name: Install Homebrew
  become: true
  become_user: "{{ common_user }}"
  ansible.builtin.shell:
    cmd: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not common_brew_installed
  changed_when: true

- name: Install common homebrew tools and fonts
  become: false
  community.general.homebrew:
    name:
      - pyenv
      - cheat
      - coreutils
      - fd
      - podman
      - pipx
    state: present
