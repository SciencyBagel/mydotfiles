- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: "{{ item }}"
  with_items:
    - /opt/homebrew/bin/brew
    - /usr/local/bin/brew
    - /home/linuxbrew/.linuxbrew/bin/brew
  register: common_brew_check

- name: Set fact if Homebrew exists
  ansible.builtin.set_fact:
    common_brew_installed: "{{ common_brew_check.results | map(attribute='stat.exists') | list is any }}"

- name: Pre-create Homebrew prefix directory on Linux
  become: true
  ansible.builtin.file:
    path: /home/linuxbrew/.linuxbrew
    state: directory
    owner: "{{ common_user }}"
    group: "{{ common_user }}"
    mode: "0755"
  when: not common_brew_installed and ansible_system == 'Linux'

- name: Install Homebrew
  become: true
  become_user: "{{ common_user }}"
  ansible.builtin.shell:
    cmd: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not common_brew_installed
  changed_when: true

- name: Install common homebrew tools
  become: false
  community.general.homebrew:
    name: "{{ common_homebrew_packages + common_homebrew_packages_extra }}"
    state: present
