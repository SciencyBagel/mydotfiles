# ansible.cfg
# Project-level Ansible configuration for Raspberry Pi lab

[defaults]
# Point to your inventory so you never need -i flag again
inventory = inventory.yml

roles_path = roles

# Default remote user for all SSH connections
# remote_user = pi

# Path to your SSH private key
# private_key_file = ~/.ssh/id_ed25519

# Speed up runs by disabling host key checking (fine for a home lab)
# Set to True in production environments
host_key_checking = False

# Show timing info per task — useful when learning
callbacks_enabled = timer, profile_tasks

# Limit parallel connections (Pis can be slow; 5 is a safe default)
forks = 5

[ssh_connection]
# Reuse SSH connections for speed — big difference on Pis over WiFi
# pipelining = True

# Faster SSH connection options
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ForwardAgent=yes
