# playbooks/bootstrap.yml
---
- name: Bootstrap passwordless sudo
  hosts:
    - raspberrypis
  become: true
  tasks:
    - name: Configure passwordless sudo for {{ target_user }}
      ansible.builtin.lineinfile:
        path: "/etc/sudoers.d/{{ target_user }}"
        line: "{{ target_user }} ALL=(ALL) NOPASSWD: ALL"
        create: true
        mode: '0440'
        validate: 'visudo -cf %s'    # validates syntax before saving — important!
