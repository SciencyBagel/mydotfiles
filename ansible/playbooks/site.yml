- name: Apply baseline system-level changes
  hosts:
    - raspberrypis
    - stations
  become: true
  roles:
    - common

- name: Provision rasbperry pis
  hosts:
    - raspberrypis
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true
  roles:
    - omz
    - lazyvim
    - mydotfiles
  tags:
    - configs

- name: Apply configs
  hosts:
    - raspberrypis
    - stations
  roles:
    - omz
    - lazyvim
    - mydotfiles
  tags:
    - configs
