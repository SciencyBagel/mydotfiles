- name: Apply baseline system-level changes
  hosts:
    - raspberrypis
    - desktops
  become: true
  roles:
    - common

- name: Provision raspberry pis
  hosts:
    - raspberrypis
  roles:
    - omz
    - lazyvim
    - mydotfiles
  tags:
    - pi

- name: Apply configs
  hosts:
    - raspberrypis
    - desktops
  roles:
    - omz
    - lazyvim
    - mydotfiles
  tags:
    - configs
